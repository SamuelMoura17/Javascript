<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 004</title>

    <style>

        body{

            font: normal 20px arial;

            background-color: burlywood;

        }

    </style>

</head>
<body>
    
    <script>

        var nome = prompt('Qual é o seu nome?');

        document.write(`<p>Olá, <strong>${nome}</strong>! Seu nome tem ${nome.length} letras</p>`)

        document.write(`<p>Seu nome em maiúsculas é <strong>${nome.toUpperCase()}</strong></p>`)

        document.write(`<p>Seu nome em minúsculas é <strong>${nome.toLowerCase()}</strong></p>`)
      
    </script>

</body>
</html>
