<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 1</title>

    <style> /* CSS */

        body{

            background-color: rgb(160, 189, 209);
            color: white;

            font: normal 1rem Arial;

        }

    </style>

</head>
<body> <!-- HTML -->

    <h1 style="text-decoration: underline;">Calculado super básica</h1>

    <script> /* JavaScript*/

         var nome = prompt(`Qual o seu nome? `)

         var n1 = parseFloat(prompt(`Digite o primeiro número: `));

         var operação = prompt(`Digite a operação desejada(+-*/): `);

         var n2 = parseFloat(prompt(`Digite o segundo número: `));

         if(operação === '+'){

            var s = n1 + n2

         }

         else if(operação === '-'){

            var s = n1 - n2

         }

         else if(operação === '*'){

            var s = n1 * n2

         }

         else if(operação === '/'){

            var s = n1 / n2

         }

         else{

            document.write(`Operação inválida`)

         }

         document.write(`<h2>Olá ${nome.toUpperCase()}, o resultado da operação: ${n1} ${operação} ${n2} é igual a: ${s}</h2>`)

    </script>

</body>
</html>
